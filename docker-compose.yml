# Assignment 4: Performance Optimization & External Integrations

services:
  redis:
    image: redis:7-alpine
    container_name: redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 10s
      retries: 10

  order-db:
    image: postgres:15-alpine
    container_name: order-db
    environment:
      POSTGRES_USER: order_user
      POSTGRES_PASSWORD: order_pass
      POSTGRES_DB: order_db
    ports:
      - "5432:5432"
    volumes:
      - order-db-data:/var/lib/postgresql/data
      - ./order-service/migrations/001_create_orders.sql:/docker-entrypoint-initdb.d/001_create_orders.sql
      - ./order-service/migrations/002_add_updated_at_to_orders.sql:/docker-entrypoint-initdb.d/002_add_updated_at_to_orders.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U order_user -d order_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  payment-db:
    image: postgres:15-alpine
    container_name: payment-db
    environment:
      POSTGRES_USER: payment_user
      POSTGRES_PASSWORD: payment_pass
      POSTGRES_DB: payment_db
    ports:
      - "5433:5432"
    volumes:
      - payment-db-data:/var/lib/postgresql/data
      - ./payment-service/migrations/001_create_payments.sql:/docker-entrypoint-initdb.d/001_create_payments.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U payment_user -d payment_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  payment-service:
    build:
      context: .
      dockerfile: payment-service/Dockerfile
      args:
        GOPROXY: https://goproxy.io,https://proxy.golang.org
    container_name: payment-service
    env_file:
      - .env
    environment:
      DB_HOST: payment-db
      DB_PORT: 5432
      DB_USER: payment_user
      DB_PASSWORD: payment_pass
      DB_NAME: payment_db
      SERVER_PORT: 8081
      GRPC_PORT: :50051
      AMQP_URL: amqp://guest:guest@rabbitmq:5672/
    ports:
      - "8081:8081"
      - "50051:50051"
    depends_on:
      payment-db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  order-service:
    build:
      context: .
      dockerfile: order-service/Dockerfile
      args:
        GOPROXY: https://goproxy.io,https://proxy.golang.org
    container_name: order-service
    env_file:
      - .env
    environment:
      DB_HOST: order-db
      DB_PORT: 5432
      DB_USER: order_user
      DB_PASSWORD: order_pass
      DB_NAME: order_db
      SERVER_PORT: 8080
      PAYMENT_BASE_URL: http://payment-service:8081
      PAYMENT_GRPC_ADDR: payment-service:50051
      GRPC_STREAM_PORT: :50052
      REDIS_URL: redis://redis:6379
    ports:
      - "8080:8080"
      - "50052:50052"
    depends_on:
      order-db:
        condition: service_healthy
      payment-service:
        condition: service_started
      redis:
        condition: service_healthy

  notification-service:
    build:
      context: .
      dockerfile: notification-service/Dockerfile
      args:
        GOPROXY: https://goproxy.io,https://proxy.golang.org
    container_name: notification-service
    env_file:
      - .env
    environment:
      AMQP_URL: amqp://guest:guest@rabbitmq:5672/
      REDIS_URL: redis://redis:6379
      PROVIDER_MODE: SIMULATED
    depends_on:
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  order-db-data:
  payment-db-data:
